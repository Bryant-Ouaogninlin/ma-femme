<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Une lettre pour Yasmina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #1b1220;
    --bg-mid2: #33202f;
    --rose: #dd93a1;
    --rose-soft: #e9b5bf;
    --gold: #e4b378;
    --cream: #f3e6e4;
    --muted: #b79aa0;
    --line: rgba(243, 230, 228, 0.14);
    --shadow: rgba(10, 4, 10, 0.55);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-mid2), var(--bg-deep) 60%);
    color: var(--cream);
    font-family: 'Work Sans', system-ui, sans-serif;
    overflow-x: hidden;
  }
  .stage {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 20px;
  }

  .petals { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .petal {
    position: absolute; top: -5vh; width: 10px; height: 10px; opacity: 0.45;
    background: var(--rose); border-radius: 0 60% 0 60%;
    animation-name: drift; animation-timing-function: linear; animation-iteration-count: infinite;
    filter: blur(0.2px);
  }
  @keyframes drift {
    from { transform: translateY(-10vh) translateX(0) rotate(0deg); }
    to   { transform: translateY(115vh) translateX(var(--drift-x, 40px)) rotate(300deg); }
  }
  @media (prefers-reduced-motion: reduce) { .petal { animation: none; display: none; } }

  /* ---------- composer ---------- */
  .composer {
    position: relative; z-index: 1; width: 100%; max-width: 420px; text-align: center;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .composer.hidden { opacity: 0; transform: scale(0.97); pointer-events: none; position: absolute; }
  .kicker {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.15rem;
    color: var(--rose-soft); margin: 0 0 6px;
  }
  .title {
    font-family: 'Cormorant Garamond', serif; font-weight: 600;
    font-size: clamp(2.1rem, 6vw, 2.8rem); line-height: 1.15; margin: 0 0 34px;
  }
  .title .to-name { font-style: italic; color: var(--gold); }
  .field { text-align: left; margin-bottom: 20px; }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 7px; }
  .field textarea {
    width: 100%; background: rgba(243, 230, 228, 0.05); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; color: var(--cream); font-family: 'Work Sans', sans-serif;
    font-size: 0.98rem; outline: none; resize: vertical; min-height: 96px; line-height: 1.5;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .field textarea::placeholder { color: rgba(183,154,160,0.65); }
  .field textarea:focus { border-color: var(--rose); background: rgba(243, 230, 228, 0.08); }
  .seal-btn {
    margin-top: 8px; width: 100%; padding: 14px 20px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--rose), var(--gold)); color: #2a1620;
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 0.98rem; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 24px -10px rgba(221, 147, 161, 0.6);
  }
  .seal-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -10px rgba(221, 147, 161, 0.75); }
  .seal-btn:active { transform: translateY(0); }

  /* ---------- envelope ---------- */
  .envelope-wrap {
    position: absolute; z-index: 1; display: flex; flex-direction: column; align-items: center;
    opacity: 0; transform: translateY(14px); pointer-events: none;
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .envelope-wrap.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .envelope-wrap.away { opacity: 0; transform: translateY(-16px); pointer-events: none; }
  .envelope-hint { font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--muted); margin-bottom: 22px; font-size: 1.05rem; }
  .envelope { position: relative; width: 240px; height: 160px; cursor: pointer; }
  .env-body {
    position: absolute; inset: 0; background: linear-gradient(160deg, #3a2436, #2a1a29);
    border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 20px 50px -15px var(--shadow);
  }
  .env-flap {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(160deg, #44293f, #331f33);
    clip-path: polygon(0 0, 100% 0, 50% 55%); border-radius: 6px 6px 0 0;
    transform-origin: top center; transition: transform 0.6s cubic-bezier(.6,.0,.3,1); z-index: 2;
  }
  .envelope.open .env-flap { transform: rotateX(180deg); }
  .seal {
    position: absolute; top: 62px; left: 50%; width: 44px; height: 44px;
    background: radial-gradient(circle at 35% 30%, var(--gold), #b5793f 70%); border-radius: 50%;
    transform: translate(-50%, 0); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px -4px rgba(0,0,0,0.6); z-index: 3;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .seal svg { width: 20px; height: 20px; fill: #2a1620; }
  .envelope.open .seal { opacity: 0; transform: translate(-50%, -6px) scale(0.6); }
  .env-note {
    position: absolute; left: 50%; bottom: 8px; width: 84%; height: 70%; background: #f3e6e4;
    border-radius: 4px; transform: translate(-50%, 0) scale(0.94); box-shadow: 0 6px 16px -6px rgba(0,0,0,0.4);
    transition: transform 0.6s cubic-bezier(.2,.8,.2,1); z-index: 1;
  }
  .envelope.open .env-note { transform: translate(-50%, -190px) scale(1); }

  /* ---------- letter ---------- */
  .letter {
    position: absolute; z-index: 1; width: 100%; max-width: 460px; text-align: center;
    opacity: 0; transform: translateY(18px) scale(0.98);
    transition: opacity 0.8s ease, transform 0.8s ease; pointer-events: none;
  }
  .letter.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .letter-card {
    background: linear-gradient(180deg, #f6ece9, #f0ded9); color: #3a1f28; border-radius: 4px;
    padding: 46px 38px 38px; box-shadow: 0 30px 70px -20px var(--shadow); position: relative;
  }
  .letter-card::before {
    content: ""; position: absolute; inset: 10px; border: 1px solid rgba(58,31,40,0.14); pointer-events: none;
  }
  .letter-to { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.3rem; color: #8a4a57; margin: 0 0 18px; }
  .letter-body {
    font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(1.25rem, 4vw, 1.55rem);
    line-height: 1.6; margin: 0 0 22px; white-space: pre-wrap;
  }
  .letter-body .word { opacity: 0; filter: blur(3px); display: inline-block; animation: reveal-word 0.5s ease forwards; }
  @keyframes reveal-word { to { opacity: 1; filter: blur(0); } }
  .letter-sign {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.1rem; color: #8a4a57;
    opacity: 0; animation: reveal-word 0.6s ease forwards;
  }

  /* ---------- question box ---------- */
  .question-box {
    margin-top: 30px; padding-top: 26px; border-top: 1px solid rgba(58,31,40,0.14);
    opacity: 0; animation: reveal-word 0.6s ease forwards;
  }
  .question-text {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.3rem;
    color: #8a4a57; margin: 0 0 20px;
  }
  .answer-zone {
    position: relative; height: 70px; display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  .answer-btn {
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 0.95rem;
    padding: 11px 26px; border-radius: 100px; cursor: pointer; border: none;
  }
  .yes-btn {
    background: linear-gradient(135deg, var(--rose), var(--gold)); color: #2a1620;
    box-shadow: 0 8px 20px -8px rgba(221,147,161,0.7);
  }
  .no-btn {
    position: relative;
    background: transparent; border: 1px solid rgba(58,31,40,0.3); color: #8a4a57;
    transition: transform 0.28s cubic-bezier(.3,1.4,.4,1);
  }

  .final-reveal {
    opacity: 0; max-height: 0; overflow: hidden;
    transition: opacity 0.6s ease, max-height 0.6s ease, margin-top 0.6s ease;
  }
  .final-reveal.show { opacity: 1; max-height: 200px; margin-top: 18px; }
  .final-text {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600;
    font-size: clamp(1.4rem, 5vw, 1.8rem); color: #8a4a57; margin: 0;
  }

  .restart { display: block; margin: 22px auto 0; background: none; border: none; color: var(--muted); font-family: 'Work Sans', sans-serif; font-size: 0.82rem; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  .burst-heart { position: fixed; z-index: 5; pointer-events: none; font-size: 20px; animation: burst-up 1.4s ease-out forwards; }
  @keyframes burst-up {
    0% { transform: translate(0,0) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--bx,0), -160px) scale(1.1); opacity: 0; }
  }

  @media (max-width: 480px) { .letter-card { padding: 34px 22px 28px; } }
</style>
</head>
<body>

<div class="petals" id="petals"></div>

<div class="stage">

  <div class="envelope-wrap" id="envelopeWrap">
    <p class="envelope-hint">Touche le sceau pour l'ouvrir</p>
    <div class="envelope" id="envelope">
      <div class="env-note"></div>
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="seal" id="sealDot">
        <svg viewBox="0 0 24 24"><path d="M12 21s-8-4.7-8-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.3-8 11-8 11z"/></svg>
      </div>
    </div>
  </div>

  <div class="letter" id="letterView">
    <div class="letter-card">
      <p class="letter-to">Pour Yasmina,</p>
      <p class="letter-body" id="letterBody"></p>
      <p class="letter-sign" id="letterSign">— avec tout mon cœur</p>

      <div class="question-box" id="questionBox">
        <p class="question-text">Tu m'aimes aussi mon ange&nbsp;?</p>
        <div class="answer-zone" id="answerZone">
          <button class="answer-btn yes-btn" id="yesBtn">Oui</button>
          <button class="answer-btn no-btn" id="noBtn">Non</button>
        </div>
        <div class="final-reveal" id="finalReveal">
          <p class="final-text">Tu es la femme de ma vie ❤</p>
        </div>
      </div>
    </div>
    <button class="restart" id="restartBtn">recommencer</button>
  </div>

</div>

<script>
(function () {
  var petalHost = document.getElementById('petals');
  var count = window.innerWidth < 600 ? 12 : 20;
  for (var i = 0; i < count; i++) {
    var p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.setProperty('--drift-x', (Math.random() * 80 - 40) + 'px');
    var dur = 10 + Math.random() * 10;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = (-Math.random() * dur) + 's';
    var size = 6 + Math.random() * 7;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    petalHost.appendChild(p);
  }

  var envelopeWrap = document.getElementById('envelopeWrap');
  var envelope = document.getElementById('envelope');
  var letterView = document.getElementById('letterView');

  // Le message est écrit ici, en dur : modifie ce texte si tu veux le changer.
  var LETTER_MESSAGE = "Depuis que tu es là, tout me paraît plus léger. J'aime nos petits riens autant que nos grands projets. Je t'aime, aujourd'hui et tous les jours d'après.";

  function prepareLetter() {
    var body = document.getElementById('letterBody');
    body.innerHTML = '';
    var words = LETTER_MESSAGE.split(/\s+/);
    words.forEach(function (w, idx) {
      var span = document.createElement('span');
      span.className = 'word';
      span.textContent = w + ' ';
      span.style.animationDelay = (idx * 0.045) + 's';
      body.appendChild(span);
    });
    document.getElementById('letterSign').style.animationDelay = (words.length * 0.045 + 0.2) + 's';
    document.getElementById('questionBox').style.animationDelay = (words.length * 0.045 + 0.6) + 's';
  }

  prepareLetter();
  setTimeout(function () { envelopeWrap.classList.add('show'); }, 250);

  envelope.addEventListener('click', function () {
    if (envelope.classList.contains('open')) return;
    envelope.classList.add('open');
    setTimeout(function () {
      envelopeWrap.classList.remove('show');
      envelopeWrap.classList.add('away');
      letterView.classList.add('show');
    }, 650);
  });

  document.getElementById('restartBtn').addEventListener('click', function () {
    letterView.classList.remove('show');
    envelope.classList.remove('open');
    document.getElementById('finalReveal').classList.remove('show');
    document.getElementById('answerZone').style.display = 'flex';
    var noBtn = document.getElementById('noBtn');
    noBtn.style.transform = 'translate(0,0)';
    prepareLetter();
    setTimeout(function () { envelopeWrap.classList.remove('away'); envelopeWrap.classList.add('show'); }, 350);
  });

  // the "Non" button dodges before it can be clicked
  var noBtn = document.getElementById('noBtn');
  var answerZone = document.getElementById('answerZone');

  function dodge() {
    var zoneRect = answerZone.getBoundingClientRect();
    var btnRect = noBtn.getBoundingClientRect();
    var maxX = Math.max(20, zoneRect.width - btnRect.width - 20);
    var maxY = Math.max(10, zoneRect.height - btnRect.height - 10);
    var x = (Math.random() * maxX) - maxX / 2;
    var y = (Math.random() * maxY) - maxY / 2;
    // bias it away from the center where the cursor usually is
    x += x >= 0 ? 30 : -30;
    noBtn.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
  }

  noBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    dodge();
  });
  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('click', function (e) { e.preventDefault(); dodge(); });

  document.getElementById('yesBtn').addEventListener('click', function (e) {
    answerZone.style.display = 'none';
    document.getElementById('finalReveal').classList.add('show');

    for (var i = 0; i < 16; i++) {
      var h = document.createElement('div');
      h.className = 'burst-heart';
      h.textContent = '♥';
      var rect = e.target.getBoundingClientRect();
      h.style.left = (rect.left + rect.width / 2 + (Math.random() * 100 - 50)) + 'px';
      h.style.top = rect.top + 'px';
      h.style.color = Math.random() > 0.5 ? '#dd93a1' : '#e4b378';
      h.style.setProperty('--bx', (Math.random() * 120 - 60) + 'px');
      h.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(h);
      (function (el) { setTimeout(function () { el.remove(); }, 1700); })(h);
    }
  });
})();
</script>

</body>
</html>
